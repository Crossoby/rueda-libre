<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna | Rueda Libre</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-slate-950 text-slate-100">
    <main class="flex min-h-screen items-center p-5 sm:p-10">
        <section class="mx-auto w-full max-w-3xl space-y-8 bg-slate-900 p-6 sm:p-12" aria-labelledby="titulo-nocturna">
            <header class="space-y-4">
                <p class="w-fit bg-lime-300/10 px-3 py-2 text-xs font-bold uppercase tracking-widest text-lime-300">Nuevo · Jueves a sábado</p>
                <h1 class="text-5xl font-black leading-tight tracking-tight text-white sm:text-7xl" id="titulo-nocturna">Rueda Nocturna</h1>
                <p class="max-w-md text-lg leading-relaxed text-slate-300 sm:text-xl">Descubre Medellín en bici cuando se encienden las luces</p>
            </header>

            <ul class="flex flex-wrap gap-3 text-sm font-semibold text-slate-200">
                <li class="bg-slate-800 px-4 py-2">3 rutas</li>
                <li class="bg-slate-800 px-4 py-2">Desde $55.000</li>
            </ul>

            <div class="flex flex-wrap gap-3">
                <a href="../paginas/reservas.html"
                    class="inline-block rounded-lg border border-transparent bg-lime-300 px-5 py-3 font-bold text-slate-950 shadow-sm
                        hover:bg-lime-200 focus:outline-hidden focus:ring-2 focus:ring-lime-300 focus:ring-offset-2 focus:ring-offset-slate-900">Inscríbete</a>
                <button type="button"
                    class="cursor-pointer rounded-lg border border-transparent bg-slate-700 px-5 py-3 font-bold text-white shadow-sm
                        hover:bg-slate-600 focus:outline-hidden focus:ring-2 focus:ring-slate-200 focus:ring-offset-2 focus:ring-offset-slate-900">Secundario</button>
                <button type="button"
                    class="cursor-pointer rounded-lg border border-lime-300 bg-transparent px-5 py-3 font-bold text-lime-300 shadow-sm
                        hover:bg-lime-300/15 focus:outline-hidden focus:ring-2 focus:ring-lime-300 focus:ring-offset-2 focus:ring-offset-slate-900">Contorno</button>
            </div>
        </section>
    </main>
</body>
</html>
